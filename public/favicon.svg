<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ayoub Lesfer">
  <!-- One split-flap module: amber glyph on the flap face, seam across the middle. -->
  <rect width="32" height="32" rx="5" fill="#17171b"/>
  <rect x="1" y="1" width="30" height="30" rx="4.2" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="16" y="23.5"
        font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="23" font-weight="700" fill="#ffb000" text-anchor="middle">A</text>
  <!-- The seam is the signature; keep it crisp at every size -->
  <rect x="0" y="15.5" width="32" height="1.4" fill="#000000" fill-opacity="0.92"/>
</svg>
